name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  crypto:
    name: Crypto vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: |
          g++ -std=c++17 -O2 -Iinclude/jiyan tests/crypto_vectors.cpp -o crypto_vectors
          ./crypto_vectors

  build:
    name: Build SDK (JNI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile unity source
        run: |
          g++ -std=c++17 -O2 -c include/jiyan/SDK_Main.cpp -o /tmp/sdk.o \
            -Iinclude/jiyan \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux"
