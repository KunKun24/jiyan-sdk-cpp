name: Feature request
description: 新算法、新平台或接入体验建议
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么做
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
